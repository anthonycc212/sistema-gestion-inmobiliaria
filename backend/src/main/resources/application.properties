# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR
# =============================================================================
server.port=${SERVER_PORT:8080}

# =============================================================================
# CONFIGURACIÓN DE REPLICACIÓN MYSQL (MASTER & REPLICA)
# =============================================================================
# Master (puerto 3306)
datasource.master.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_MASTER:3306}/${DB_NAME:inmobiliaria_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
datasource.master.username=${DB_USER:root}
datasource.master.password=${DB_PASSWORD:}
datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver

# Replica (puerto 3307). En la nube apunta al mismo servidor que el Master
datasource.replica.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_REPLICA:3307}/${DB_NAME:inmobiliaria_db}?useSSL=${DB_USE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
datasource.replica.username=${DB_USER_REPLICA:${DB_USER:root}}
datasource.replica.password=${DB_PASSWORD_REPLICA:${DB_PASSWORD:}}
datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# =============================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =============================================================================
# CORS: origenes permitidos del frontend (separados por coma)
# =============================================================================
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173}
