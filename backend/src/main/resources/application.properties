# =============================================================================
# CONFIGURACIÓN DEL SERVIDOR
# =============================================================================
server.port=${SERVER_PORT:8080}

# =============================================================================
# CONFIGURACIÓN DE REPLICACIÓN MYSQL (MASTER & REPLICA)
# Credenciales seguras desacopladas mediante variables de entorno
# =============================================================================
# MASTER (Escritura y transacciones principales - Puerto 3306)
datasource.master.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_MASTER:3306}/${DB_NAME:inmobiliaria_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
datasource.master.username=${DB_USER:root}
datasource.master.password=${DB_PASSWORD:}
datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver

# REPLICA (Lectura optimizada - Puerto 3307)
datasource.replica.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT_REPLICA:3307}/${DB_NAME:inmobiliaria_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
datasource.replica.username=${DB_USER_REPLICA:${DB_USER:root}}
datasource.replica.password=${DB_PASSWORD_REPLICA:${DB_PASSWORD:}}
datasource.replica.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# =============================================================================
# Modo estricto: valida el esquema preexistente sin recrear ni alterar tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================================================
# CONFIGURACIÓN DE SEGURIDAD Y JWT
# Secreto y expiración desacoplados mediante variables de entorno
# =============================================================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}
